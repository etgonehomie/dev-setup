---
- name: Install selected Homebrew packages
  hosts: localhost
  vars:
    selected_formulae: "{{ (selected_formulae_csv | default('') | split(',')) | map('trim') | reject('equalto', '') | list }}"
    selected_casks: "{{ (selected_casks_csv | default('') | split(',')) | map('trim') | reject('equalto', '') | list }}"
  tasks:
    - name: Ensure Homebrew cask fonts tap is available when needed
      homebrew_tap:
        name: homebrew/cask-fonts
        state: present
      when: "'font-hack-nerd-font' in selected_casks"

    - name: Install selected Homebrew formulae
      homebrew:
        name: "{{ item }}"
        state: present
      loop: "{{ selected_formulae }}"

    - name: Install selected Homebrew casks
      homebrew_cask:
        name: "{{ item }}"
        state: present
      loop: "{{ selected_casks }}"
      ignore_errors: true
      register: selected_casks_result

    - name: Remove group/other write perms from dynamic zsh dir
      ansible.builtin.file:
        path: "{{ brew_prefix }}/share"
        mode: "go-w"
        recurse: true

    - name: Show optional cask failures summary
      ansible.builtin.debug:
        msg: >-
          Optional cask install failures:
          {{ selected_casks_result.results
             | rejectattr('failed', 'undefined')
             | selectattr('failed')
             | map(attribute='item')
             | list }}
      when:
        - selected_casks_result is defined
        - selected_casks_result.results is defined
