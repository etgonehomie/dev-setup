---
- name: Use Homebrew to Install CLI & Dev tools
  hosts: localhost
  vars_files:
    - vars.yml    # relative path to current playbook
  vars:
    # Source paths of dotfile templates
    zshenv_repo_url: "{{ root_dir }}/dotfiles/terminal/.zshenv"
    zshrc_repo_url: "{{ root_dir }}/dotfiles/terminal/.zshrc"
    theme_filename: 'zen.toml'
    theme_repo_url: "{{ root_dir}}/dotfiles/oh-my-posh/themes/{{ theme_filename }}"

    # Destination system paths
    themes_local_dir: "{{ brew_prefix }}/share/oh-my-posh/themes"
    themes_symlink_dir: "{{ ansible_facts['env']['HOME'] }}/.config/oh-my-posh/themes"
    iterm_dynamic_profiles_dir: "{{ ansible_facts['env']['HOME'] }}/Library/Application Support/iTerm2/DynamicProfiles"
    iterm_profile_filename: "dev-setup-profile.json"
    iterm_profile_repo_url: "{{ root_dir }}/dotfiles/iterm2/{{ iterm_profile_filename }}"
    iterm_profile_guid: "B1CD20E9-C2BC-4FA5-8B96-7B66BA639F1E"
    dotfiles_overwrite: "{{ (dotfiles_overwrite_mode | default('never')) == 'always' }}"
    dotfiles_backup_dir: "{{ ansible_facts['env']['HOME'] }}/.config/dev-setup/backups"

  tasks:
    - name: Ensure dotfile backup dir exists
      ansible.builtin.file:
        path: "{{ dotfiles_backup_dir }}"
        state: directory
        mode: "0755"

    - name: Check if ~/.zshenv exists
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshenv"
      register: zshenv_stat

    - name: Backup ~/.zshenv before overwrite
      ansible.builtin.copy:
        src: "{{ ansible_facts['env']['HOME'] }}/.zshenv"
        dest: "{{ dotfiles_backup_dir }}/.zshenv.{{ ansible_date_time.epoch }}.bak"
        remote_src: true
      when:
        - zshenv_stat.stat.exists
        - dotfiles_overwrite

    - name: Copy .zshenv from {{ root_dir }} to {{ ansible_facts['env']['HOME'] }}
      ansible.builtin.copy:
        src: "{{ zshenv_repo_url }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.zshenv"
        remote_src: true
        force: "{{ dotfiles_overwrite }}"
      when: dotfiles_overwrite or not zshenv_stat.stat.exists

    - name: Check if ~/.zshrc exists
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
      register: zshrc_stat

    - name: Backup ~/.zshrc before overwrite
      ansible.builtin.copy:
        src: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        dest: "{{ dotfiles_backup_dir }}/.zshrc.{{ ansible_date_time.epoch }}.bak"
        remote_src: true
      when:
        - zshrc_stat.stat.exists
        - dotfiles_overwrite

    - name: Copy .zshrc from {{ root_dir }} to {{ ansible_facts['env']['HOME'] }}
      ansible.builtin.copy:
        src: "{{ zshrc_repo_url }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        remote_src: true
        force: "{{ dotfiles_overwrite }}"
      when: dotfiles_overwrite or not zshrc_stat.stat.exists
  
    # Update terminal theming using oh-my-posh    
    - name: Ensure terminal themes dir exists at {{ themes_local_dir }}
      file:
        path: "{{ themes_local_dir }}"
        state: directory

    - name: Copy terminal theme from {{ root_dir }} to {{ themes_local_dir }}
      ansible.builtin.copy:
        src: "{{ theme_repo_url }}"
        dest: "{{ themes_local_dir }}/{{ theme_filename }}"
        remote_src: true
        force: true

    # Create symlink to themes in .config file for easy reference
    - name: Ensure parent dir exists for symlink at {{ themes_symlink_dir }}
      file:
        path: "{{ themes_symlink_dir | dirname }}"
        state: directory

    - name: Create a symbolic link for themes dir at {{ themes_symlink_dir }}
      file:
        src: "{{ themes_local_dir }}"
        dest: "{{ themes_symlink_dir }}"
        state: link

    - name: Ensure iTerm2 dynamic profiles dir exists at {{ iterm_dynamic_profiles_dir }}
      ansible.builtin.file:
        path: "{{ iterm_dynamic_profiles_dir }}"
        state: directory

    - name: Copy iTerm2 dynamic profile from {{ root_dir }} to {{ iterm_dynamic_profiles_dir }}
      ansible.builtin.copy:
        src: "{{ iterm_profile_repo_url }}"
        dest: "{{ iterm_dynamic_profiles_dir }}/{{ iterm_profile_filename }}"
        remote_src: true
        force: true

    - name: Set iTerm2 default profile to Dev Setup Nerd Font profile
      ansible.builtin.command: defaults write com.googlecode.iterm2 "Default Bookmark Guid" -string "{{ iterm_profile_guid }}"
      changed_when: false
